name: Build and test

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: microsoft/setup-msbuild@v2
      - name: Build Windows projects
        run: dotnet build PhoneUnlock.sln -c Release
      - name: Build x64 Credential Provider
        run: msbuild windows/PhoneUnlock.CredentialProvider/PhoneUnlock.CredentialProvider.vcxproj /m /p:Configuration=Release /p:Platform=x64
      - name: Run Core self-tests
        run: dotnet run --project windows/PhoneUnlock.Core.Tests/PhoneUnlock.Core.Tests.csproj -c Release --no-build
      - name: Run Service self-tests
        run: dotnet run --project windows/PhoneUnlock.Service.Tests/PhoneUnlock.Service.Tests.csproj -c Release --no-build
      - name: Build Windows release package
        shell: pwsh
        run: |
          dotnet publish windows/PhoneUnlock.Service/PhoneUnlock.Service.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/package/service
          dotnet publish windows/PhoneUnlock.Setup/PhoneUnlock.Setup.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/package/setup
          dotnet publish windows/PhoneUnlock.Agent/PhoneUnlock.Agent.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/package/agent
          New-Item -ItemType Directory -Path artifacts/package/credential-provider -Force | Out-Null
          Copy-Item windows/PhoneUnlock.CredentialProvider/x64/Release/PhoneUnlock.CredentialProvider.dll artifacts/package/credential-provider/
          Copy-Item windows/PhoneUnlock.Installer/*.ps1 artifacts/package/
          Copy-Item windows/PhoneUnlock.Installer/*.cmd artifacts/package/
          Copy-Item windows/PhoneUnlock.Installer/*.md artifacts/package/
          Copy-Item THIRD_PARTY_NOTICES.md artifacts/package/
          Compress-Archive -Path artifacts/package/* -DestinationPath artifacts/PhoneUnlock-Windows-x64.zip -Force
      - name: Build single-file Windows installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) { throw 'Inno Setup compiler was not installed.' }
          & $compiler windows/PhoneUnlock.Installer/PhoneUnlock.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE." }
      - uses: actions/upload-artifact@v4
        with:
          name: PhoneUnlock-Windows
          path: |
            artifacts/PhoneUnlock-Setup.exe
            artifacts/PhoneUnlock-Windows-x64.zip
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore Android release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PHONE_UNLOCK_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/phoneunlock-release.jks"
      - name: Build stable-signed Android APK
        working-directory: android/PhoneUnlock
        env:
          PHONE_UNLOCK_KEYSTORE_PATH: ${{ runner.temp }}/phoneunlock-release.jks
          PHONE_UNLOCK_KEYSTORE_PASSWORD: ${{ secrets.PHONE_UNLOCK_KEYSTORE_PASSWORD }}
          PHONE_UNLOCK_KEY_ALIAS: ${{ secrets.PHONE_UNLOCK_KEY_ALIAS }}
          PHONE_UNLOCK_KEY_PASSWORD: ${{ secrets.PHONE_UNLOCK_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: PhoneUnlock-Android
          path: android/PhoneUnlock/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: PhoneUnlock-Windows
          path: artifacts/windows
      - uses: actions/download-artifact@v4
        with:
          name: PhoneUnlock-Android
          path: artifacts/android
      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/release
          cp artifacts/windows/PhoneUnlock-Setup.exe artifacts/release/PhoneUnlock-Setup.exe
          cp artifacts/windows/PhoneUnlock-Windows-x64.zip artifacts/release/PhoneUnlock-Windows-x64.zip
          cp artifacts/android/app-release.apk artifacts/release/PhoneUnlock-Android.apk
          sha256sum artifacts/release/* | tee artifacts/release/SHA256SUMS.txt
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" artifacts/release/* \
            --title "Phone Unlock ${GITHUB_REF_NAME}" \
            --notes-file docs/RELEASE_NOTES-0.4.0-beta.12.md
